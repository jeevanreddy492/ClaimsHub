name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, unit + API tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m pip install -U pip setuptools && pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app scripts
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term --cov-fail-under=80
      - name: Security scan
        run: bandit -q -r app -ll && pip-audit --skip-editable

  integration:
    name: Backend - Oracle integration tests
    runs-on: ubuntu-latest
    needs: backend
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci_only_pw
          APP_USER: claimshub
          APP_USER_PASSWORD: claimshub
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      CLAIMSHUB_DATABASE_URL: oracle+oracledb://claimshub:claimshub@localhost:1521/?service_name=FREEPDB1
      CLAIMSHUB_JWT_SECRET: ci-secret-0123456789-abcdefghij
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m pip install -U pip setuptools && pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Deploy PL/SQL (fails if CLAIMS_PKG does not compile)
        run: python -m scripts.deploy_plsql --skip-jobs
      - name: Demo users
        run: python -m scripts.seed --claims 0
      - name: Integration tests
        run: pytest -m integration -o addopts="" tests/integration -v
      - name: Migration can roll back
        run: alembic downgrade base && alembic upgrade head

  frontend:
    name: Frontend - lint, types, tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t claimshub-api ./backend
      - run: docker build -t claimshub-web ./frontend
