[ClaimsHub - Error rate by endpoint (24h)]
search = sourcetype=claimshub:json event=http_request earliest=-24h \
| eval is_error=if(status_code>=500,1,0) \
| stats count AS requests, sum(is_error) AS errors BY route \
| eval error_pct=round(errors/requests*100,2) | sort - error_pct
dispatch.earliest_time = -24h

[ClaimsHub - Slowest endpoints p95 (24h)]
search = sourcetype=claimshub:json event=http_request earliest=-24h \
| stats count, perc95(duration_ms) AS p95_ms, max(duration_ms) AS max_ms BY route \
| sort - p95_ms
dispatch.earliest_time = -24h

[ClaimsHub - Trace one request]
search = sourcetype=claimshub:json correlation_id="$correlation_id$" | sort _time \
| table _time level logger message event route status_code duration_ms error_code error_message ora_code exception

[ClaimsHub - Oracle errors by code (7d)]
search = sourcetype=claimshub:json event=database_error earliest=-7d | stats count BY ora_code | sort - count
dispatch.earliest_time = -7d

[ClaimsHub - Business errors (24h)]
search = sourcetype=claimshub:json event=domain_error earliest=-24h | stats count BY error_code | sort - count
dispatch.earliest_time = -24h

[ClaimsHub - Failed logins (24h)]
search = sourcetype=claimshub:json event=login_failed earliest=-24h | stats count BY username | sort - count
dispatch.earliest_time = -24h

[ClaimsHub - Claims filed per hour (7d)]
search = sourcetype=claimshub:json event=claim_filed earliest=-7d | timechart span=1h count BY claim_type
dispatch.earliest_time = -7d
