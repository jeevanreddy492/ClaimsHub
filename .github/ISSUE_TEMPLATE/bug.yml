name: Bug
description: Something works wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the error message and the ref / correlation ID }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: correlation
    attributes: { label: Correlation ID }
